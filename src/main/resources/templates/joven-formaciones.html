<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>CompuJoven - Formaciones Disponibles</title>
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>
<body>

    <div th:replace="~{fragments/navbar :: barraNavegacion}"></div>

    <main class="contenedor">
        <div class="encabezado-pagina">
            <div>
                <h1>Formaciones Disponibles</h1>
                <p class="subtitulo">Elige una formación y postúlate con un clic.</p>
            </div>
        </div>

        <div class="alerta alerta-exito" th:if="${mensajeExito}">
            <strong th:text="${mensajeExito}">¡Postulación exitosa!</strong>
        </div>

        <div class="alerta alerta-error" th:if="${mensajeError}">
            <strong th:text="${mensajeError}">Ocurrió un error.</strong>
        </div>

        <div class="tarjeta">
            <div class="tabla-wrap">
                <table class="tabla">
                    <thead>
                        <tr>
                            <th>Nombre</th>
                            <th>Descripción</th>
                            <th>Duración</th>
                            <th>Estado</th>
                            <th>Acción</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="f : ${formaciones}">
                            <td><strong th:text="${f.nombre}">Curso Java</strong></td>
                            <td th:text="${f.descripcion}">Curso Backend</td>
                            <td th:text="${f.duracion}">40h</td>
                            <td>
                                <span class="insignia insignia-ok" th:if="${f.abierta}">Inscripciones Abiertas</span>
                                <span class="insignia insignia-cerrada" th:if="${not f.abierta}">Convocatoria Cerrada</span>
                            </td>
                            <td>
                                <span class="insignia insignia-info" th:if="${postuladas.contains(f.id)}">Ya te postulaste</span>
                                <form th:if="${f.abierta and not postuladas.contains(f.id)}"
                                      th:action="@{/joven/postular/{id}(id=${f.id})}" method="post">
                                    <button type="submit" class="btn btn-primario btn-pequeno">Postularme</button>
                                </form>
                                <span class="vacio" th:if="${not f.abierta and not postuladas.contains(f.id)}">No disponible</span>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

</body>
</html>
