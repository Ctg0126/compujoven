<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>CompuJoven - Acceso</title>
</head>
<body>

    <h1>CompuJoven</h1>

    
    <div>
        <button type="button" onclick="mostrarPestana('login')">Iniciar Sesión</button>
        <button type="button" onclick="mostrarPestana('registro')">Registrarse</button>
    </div>

    <hr>

    <p th:if="${error}" th:text="${error}"></p>
    <p th:if="${errorRegistro}" th:text="${errorRegistro}"></p>
    <p th:if="${param.registroExitoso}">¡Registro exitoso! Inicia sesión.</p>

    <div id="seccion-login" style="display: none;">
        <h2>Iniciar Sesión</h2>
        <form th:action="@{/login}" method="post">
            <label>Correo Electrónico:</label><br>
            <input type="email" name="email" placeholder="correo@ejemplo.com" required /><br><br>
            
            <label>Contraseña:</label><br>
            <input type="password" name="password" placeholder="******" required /><br><br>
            
            <button type="submit">Ingresar</button>
        </form>
    </div>


    <div id="seccion-registro" style="display: none;">
        <h2>Registrarse</h2>
        <form th:action="@{/registro}" method="post">
            
            <label>Nombre Completo:</label><br>
            <input type="text" name="nombre" required /><br><br>

            <label>Peso (kg):</label><br>
            <input type="number" step="0.1" name="peso" placeholder="Ej: 65.5" required /><br><br>

            <label>Altura (m):</label><br>
            <input type="number" step="0.01" name="altura" placeholder="Ej: 1.70" required /><br><br>

            <label>Tipo de Documento:</label><br>
            <select name="tipoDocumento" required>
                <option value="" disabled selected>Seleccione un tipo</option>
                <option value="CC">Cédula de Ciudadanía (CC)</option>
                <option value="TI">Tarjeta de Identidad (TI)</option>
                <option value="CE">Cédula de Extranjería (CE)</option>
                <option value="PEP">Permiso Especial de Permanencia (PEP)</option>
                <option value="PPT">Permiso por Protección Temporal (PPT)</option>
                <option value="PASAPORTE">Pasaporte</option>
            </select><br><br>

            <label>Número de Documento:</label><br>
            <input type="number" name="numeroDocumento" required /><br><br>

            <label>Edad:</label><br>
            <input type="number" name="edad" min="15" max="120" required /><br><br>

            <label>Correo Electrónico:</label><br>
            <input type="email" name="email" required /><br><br>

            <label>Contraseña:</label><br>
            <input type="password" name="password" required /><br><br>

            <label>Rol:</label><br>
            <select name="rol">
                <option value="JOVEN">Joven (Usuario)</option>
                <option value="ADMINISTRADOR">Administrador (Empresa)</option>
            </select><br><br>

            <button type="submit">Crear Cuenta</button>
        </form>
    </div>


    <script>
        function mostrarPestana(tipo) {
            const login = document.getElementById('seccion-login');
            const registro = document.getElementById('seccion-registro');

            if (tipo === 'login') {
                login.style.display = 'block';
                registro.style.display = 'none';
            } else if (tipo === 'registro') {
                login.style.display = 'none';
                registro.style.display = 'block';
            }
        }
    </script>

</body>
</html>
