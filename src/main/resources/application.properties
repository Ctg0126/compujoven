server.port=8081

# --- MySQL (MySQL Workbench) ---
# Usa variables de entorno DB_USER / DB_PASSWORD, o cambia los valores por defecto localmente.
spring.datasource.url=jdbc:mysql://localhost:3306/compujoven?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Bogota&characterEncoding=UTF-8
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:Compujoven2026}

# Hibernate crea/actualiza las tablas a partir de las entidades
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=true

# Administrador inicial (se crea solo si no existe)
compujoven.admin.email=${ADMIN_EMAIL:admin@compujoven.com}
compujoven.admin.password=${ADMIN_PASSWORD:admin123}
