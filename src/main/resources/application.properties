server.port=8081

# --- Docker Compose ---
# Con Docker Desktop abierto, Spring Boot levanta solo el MySQL de docker-compose.yml
# y se conecta a él automáticamente. Para usar un MySQL instalado en el equipo
# (sin Docker), define la variable de entorno USE_DOCKER_COMPOSE=false.
spring.docker.compose.enabled=${USE_DOCKER_COMPOSE:true}

# --- Base de datos MySQL ---
# Estos valores se usan cuando Docker Compose está desactivado (MySQL local donde
# se haya ejecutado database/compujoven.sql).
# Para otro servidor, puerto o clave, define las variables de entorno
# DB_URL, DB_USER y DB_PASSWORD (no hace falta editar este archivo).
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/compujoven?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Bogota&characterEncoding=UTF-8}
spring.datasource.username=${DB_USER:compujoven}
spring.datasource.password=${DB_PASSWORD:compujoven123}

# Si MySQL todavía está arrancando, la app espera hasta 30 s en vez de caerse
spring.datasource.hikari.initialization-fail-timeout=30000
spring.datasource.hikari.connection-timeout=30000

# Hibernate crea/actualiza las tablas a partir de las entidades
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=true

# Subida de hojas de vida (PDF / DOCX, máximo 5 MB)
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# Administrador inicial (se crea solo si no existe)
compujoven.admin.email=${ADMIN_EMAIL:admin@compujoven.com}
compujoven.admin.password=${ADMIN_PASSWORD:admin123}
